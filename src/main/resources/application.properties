# ============================================================
# CyberShield Nexus - Application Configuration
# ============================================================

# Server
server.port=8081
spring.application.name=CyberShieldNexus

# ============================================================
# PostgreSQL Database
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/cybershield_db
spring.datasource.username=cybershield_user
spring.datasource.password=CyberShield@2024
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
# 'update' = auto-creates/alters tables on startup (safe for dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT Configuration
# ============================================================
# Secret key (must be at least 256 bits for HS256)
# IMPORTANT: Change this in production to a secure random value
app.jwt.secret=CyberShieldNexusSecretKey2024PYHack02VITVelloreAICTE
app.jwt.expiration-ms=86400000

# ============================================================
# Logging
# ============================================================
logging.level.com.cybershield=DEBUG
logging.level.org.springframework.security=DEBUG

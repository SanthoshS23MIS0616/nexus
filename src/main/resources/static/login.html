<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberShield Nexus — Login</title>
  <meta name="description" content="Login to CyberShield Nexus Security Intelligence Platform">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-dark: #0a0e1a; --bg-card: #111827; --bg-card2: #1a2236;
      --border: #1e2d45; --accent: #00d4ff; --accent2: #7c3aed;
      --accent-red: #ef4444; --text-primary: #e2e8f0; --text-secondary: #94a3b8;
      --text-muted: #475569;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Glowing orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width:400px; height:400px; background:rgba(0,212,255,0.08); top:-100px; right:-100px; }
    .orb-2 { width:300px; height:300px; background:rgba(124,58,237,0.08); bottom:-50px; left:-50px; animation-delay:-4s; }

    @keyframes float {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
      box-shadow: 0 0 30px rgba(0,212,255,0.3);
      animation: glowPulse 3s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 30px rgba(0,212,255,0.3); }
      50% { box-shadow: 0 0 50px rgba(0,212,255,0.5); }
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    .brand-tagline {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .login-card h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
    }

    input::placeholder { color: var(--text-muted); }

    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .error-msg.show { display: flex; }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-login .spinner-inline {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner-inline { display: block; }

    .demo-creds {
      margin-top: 20px;
      padding: 14px;
      background: var(--bg-card2);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .demo-creds p {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .demo-cred {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-secondary);
    }

    .demo-role {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Inter', sans-serif;
    }

    .role-admin   { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .role-sadmin  { background: rgba(0,212,255,0.15); color: var(--accent); }
    .role-viewer  { background: rgba(100,116,139,0.15); color: var(--text-muted); }

    .quick-login {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-container">
    <div class="login-brand">
      <div class="brand-icon">🛡️</div>
      <div class="brand-name">CyberShield Nexus</div>
      <div class="brand-tagline">Security Intelligence Platform</div>
    </div>

    <div class="login-card">
      <h2>Welcome back</h2>
      <p>Sign in to access the security dashboard</p>

      <div class="error-msg" id="error-msg">
        <span>🔒</span>
        <span id="error-text">Invalid credentials</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔑</span>
            <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span class="btn-text">Sign In →</span>
          <div class="spinner-inline"></div>
        </button>
      </form>

      <div class="demo-creds">
        <p>Demo Credentials</p>
        <div class="demo-cred">
          <span>admin / Admin@123</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="demo-role role-admin">ADMIN</span>
            <span class="quick-login" onclick="fillCreds('admin')">use</span>
          </div>
        </div>
        <div class="demo-cred">
          <span>serveradmin / Admin@123</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="demo-role role-sadmin">SERVER_ADMIN</span>
            <span class="quick-login" onclick="fillCreds('serveradmin')">use</span>
          </div>
        </div>
        <div class="demo-cred">
          <span>viewer / Admin@123</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="demo-role role-viewer">VIEWER</span>
            <span class="quick-login" onclick="fillCreds('viewer')">use</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:8081/api';

    // Redirect if already logged in
    if (localStorage.getItem('cs_token')) {
      window.location.href = '/dashboard.html';
    }

    function fillCreds(user) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = 'Admin@123';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errorEl = document.getElementById('error-msg');
      const errorText = document.getElementById('error-text');

      btn.classList.add('loading');
      btn.disabled = true;
      errorEl.classList.remove('show');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorText.textContent = data.message || data.error || 'Invalid credentials';
          errorEl.classList.add('show');
          return;
        }

        // Store token and user info
        localStorage.setItem('cs_token', data.token);
        localStorage.setItem('cs_user', JSON.stringify({
          username: data.username,
          role: data.role
        }));

        window.location.href = '/dashboard.html';

      } catch (err) {
        errorText.textContent = 'Server unreachable. Make sure the backend is running on port 8081.';
        errorEl.classList.add('show');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
